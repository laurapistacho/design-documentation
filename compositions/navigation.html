                         |     |\n|        | | Title                        [Actions]         |     |\n| hover  | | [Filter bar]                                    |     |\n| expands| +-------------------------------------------------+     |\n| to     |                                                         |\n| 248px  | Page Content                                            |\n| panel  |                                                         |\n+--------+---------------------------------------------------------+\n```\n\n## TopNav (56px)\n\nFixed at top, spans full width. Contains:\n\n| Position | Element | Behavior |\n|----------|---------|----------|\n| Left | Logo (ReviewPro/Shiji) | Link to dashboard |\n| Left-center | Establishment selector | Dropdown, shows current property |\n| Center | Date range selector | Dropdown, shows selected period |\n| Right | Notifications | Badge with count, opens panel |\n| Right | Help | Opens help center |\n| Right | Avatar | User menu dropdown |\n\n**Variants:**\n- Default (single property): establishment name + date\n- Corporate (multi-property): corporate banner, different nav background (#172554)\n\n**Background:** RPP-70 (#014cb7) for default, corporate navy (#172554) for chain view.\n\n## SideNav\n\n### Collapsed State (Icon Rail, 56px)\n\nVertical icon list. Each icon represents a section. Active section highlighted.\nOn hover: tooltip with section name.\n\n### Expanded State (Panel, ~248px)\n\nSlides out on hover or click. Shows:\n- Section title with \"New\" chip (if applicable)\n- Sub-navigation items as text links\n- Dividers between groups\n\n### Sections (12 total)\n\n| Section | Icon | Contains |\n|---------|------|----------|\n| Dashboard | grid | Overview, My Page |\n| Reviews | star | Review list, Response management |\n| Surveys | clipboard | Survey results, Configuration |\n| Semantic | brain | Semantic analysis, Topics |\n| Cases | folder | Case management |\n| Messaging | chat | Conversations, Channels |\n| Guests | people | Guest profiles |\n| Revenue Optimizer | trending | Rate optimization |\n| Analytics | chart | Reports, Custom analytics |\n| Manage | settings | Team, Properties, Integrations |\n| Settings | gear | Account, Notifications, Permissions |\n| Learning | book | Help resources, Academy |\n\n### Mobile Behavior\n\nBelow `sm` breakpoint (768px):\n- SideNav becomes a full-screen drawer overlay\n- Opened via hamburger icon in TopNav\n- Closes on navigation or outside tap\n\n## Page Header\n\nSits at the top of the content area. Contains:\n\n1. **Breadcrumbs** (optional) — shows path within the section\n2. **Title row** — page name + action buttons (right-aligned)\n3. **Filter bar** (optional) — toggle buttons, search, filter icon with badge\n\n### Header Variants\n\n| Type | Content |\n|------|---------|\n| Default | Title + actions |\n| With breadcrumbs | Breadcrumbs above title |\n| With tabs | Tab bar below title (replaces filter bar) |\n| With filters | Filter bar with toggle groups + search |\n\n## Responsive Behavior\n\n| Breakpoint | Navigation |\n|-----------|------------|\n| \u003e= lg (1440px) | Full layout, sidebar can stay expanded |\n| md-lg (980-1440px) | Collapsed sidebar by default |\n| sm-md (768-980px) | Collapsed sidebar, simplified header |\n| \u003c sm (768px) | No sidebar rail, drawer overlay, stacked header |\n\n## Do / Don't\n\n- Do: keep the TopNav consistent across all pages\n- Don't: hide the TopNav on scroll\n- Do: highlight the active SideNav section\n- Don't: nest more than 2 levels in the sidebar panel\n- Do: collapse the sidebar when content needs space (data tables, charts)\n- Don't: put actions in the sidebar — it's for navigation only\n\n## Implementation\n\n**Figma:** TopNav `7184:569`, SideNav `7276:69098`, Layout `7380:15578`, navcollapsed `9503:20982`\n**Code:** `@reviewpro/ui-components` \u003e `TopBar`, `Sidebar`, `NavigationBar`, `compositions/Navigation/`\n**Storybook:** `libs/ui-components/src/compositions/Navigation/`\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"content\":\"$11\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"ReviewPro Design System\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Design documentation, components, patterns, and foundations for the ReviewPro platform.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
