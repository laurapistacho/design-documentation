---------------------------------------+\n```\n\n## Components Involved\n\n| Element | Component | Figma |\n|---------|-----------|-------|\n| Table container | Table | `5954:36961` (Row) |\n| Header cell | Header label | `5968:26042` |\n| Data cell | Row Content | `5958:23143` |\n| Row background | Row-Background | `5950:21390` |\n| Hover actions | Actions-on-Hover | `5965:24163` |\n| Pagination | Paginator | `27:6875` |\n| Cell state | Cell-State | `5952:41426` |\n\n## Row Types\n\n| Type | Usage |\n|------|-------|\n| Header | Column labels + sort indicators, sticky on scroll |\n| Data (default) | Standard content row |\n| Data (editable) | Inline-edit fields visible |\n| Toolbar | Search + filters + bulk actions above table |\n| Pagination | Page navigation below table |\n| Bottom Actions | Action buttons below table (save, cancel) |\n| Mobile | Card-like stacked layout for narrow viewports |\n\n## Row Sizes\n\n| Size | Row Height | Usage |\n|------|-----------|-------|\n| L | 56px | Default, comfortable reading |\n| M | 48px | Compact, more rows visible |\n| S | 40px | Dense, dashboards, monitoring |\n\n## Cell Content Types\n\n| Type | Elements |\n|------|----------|\n| Text + Chip | Primary text, optional secondary line, status chip |\n| Icon Buttons | Action icons (edit, delete, more) |\n| Checkbox/Radio | Selection cells |\n| Switch | Toggle state |\n| Field (inline) | Editable text/select within the row |\n| Bar | Volume/progress indicator |\n| Change | Delta value with trend arrow |\n| Icons | Status/channel indicators |\n| Drag | Drag handle for reordering |\n\n## Interactions\n\n### Sort\n- Click header toggles: none \u003e ascending \u003e descending\n- Active sort shows arrow indicator\n- Only one column sorted at a time (default)\n\n### Selection\n- Checkbox in first column (header = select all)\n- Selected rows get highlighted background\n- Bulk action bar appears when selection \u003e 0\n\n### Actions on Hover\n- Action buttons float in from the right on row hover\n- Typically: edit, delete, more (3 max without overflow)\n- Positioned above row content, white background gradient\n\n### Pagination\n- Rows per page selector (default: 25, options: 10/25/50/100)\n- Page count label: \"1-25 of 142\"\n- Navigation: first, prev, next, last\n\n### Inline Edit\n- Triggered by row click or edit action\n- Row expands slightly, fields become active\n- Save/Cancel appear (inline or in footer)\n- Cell border changes to focused state\n\n## Row States\n\n| State | Appearance |\n|-------|------------|\n| Rest | No highlight |\n| Hover | Light background (#F8F8F8 or neutral_05) |\n| Selected | Blue tint background (#EBF2F8) |\n| Disabled | Muted text, no interaction |\n| Focused | Blue border outline (accessibility) |\n\n## Do / Don't\n\n- Do: make headers sticky on scroll for long tables\n- Don't: use horizontal scroll unless absolutely necessary (prefer column priority)\n- Do: provide a clear empty state when no data matches filters\n- Don't: hide pagination when there's only one page (show it disabled)\n- Do: use actions-on-hover for secondary actions\n- Don't: put more than 3 visible actions per row (use a \"more\" menu)\n- Do: align numeric data right, text left\n- Don't: alternate row colors — use hover + divider lines instead\n\n## Empty State\n\nWhen a table has no data:\n- Replace the table body with the Perkins/Placeholder component\n- Show: icon + \"No results found\" message + clear filters CTA\n- Keep the header row visible (user can still sort/filter)\n\n## Responsive Strategy\n\n| Breakpoint | Behavior |\n|-----------|----------|\n| \u003e= md (980px) | Full table with all columns |\n| sm-md (768-980px) | Hide low-priority columns, show \"more\" expand |\n| \u003c sm (768px) | Card-based layout, one card per row |\n\n## Implementation\n\n**Figma:** Row `5954:36961`, Cell `5954:36396`, Header `5968:26042`\n**Code:** `@reviewpro/ui-components` \u003e `Table`, `TableHead`, `TableBody`, `TableRow`, `TableCell`, `TableSortableHead`, `TablePagination`, `TableRowAction`, `TableCellActions`\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"content\":\"$11\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"ReviewPro Design System\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Design documentation, components, patterns, and foundations for the ReviewPro platform.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
