one form (dialog, page) | Large (48px) | Comfortable, spacious |\n| Table inline edit | Small (36px) | Matches row height |\n| Filter bar | Small (36px) | Compact, secondary to content |\n| Settings page | Large (48px) | Primary editing context |\n\nRule: don't mix Large and Small in the same form.\n\n## Validation Pattern\n\n### When to Validate\n\n| Trigger | What to Check |\n|---------|---------------|\n| On blur (field loses focus) | Required, format, min/max length |\n| On submit | All fields, cross-field dependencies |\n| On input (live) | Only for search/filter — never for form fields |\n\n### Validation States\n\n| State | Visual | Helper Text |\n|-------|--------|-------------|\n| Default | Gray border (#777777) | Guidance text (optional) |\n| Error | Red border (#D3000C) + red helper | What went wrong + how to fix |\n| Warning | Yellow border (#C28A29) + yellow helper | Non-blocking issue |\n| Success | No special state (field returns to default) | — |\n\n### Error Messages\n\n- Write in sentence case, no period\n- State what's wrong: \"Email address is required\"\n- Don't blame the user: \"Invalid email\" \u003e \"You entered an invalid email\"\n- Be specific: \"Must be at least 8 characters\" \u003e \"Too short\"\n\n## Form Actions\n\n### Placement\n\n- **Dialog forms:** Footer row, right-aligned. Primary rightmost.\n- **Page forms:** Sticky footer bar or inline at form bottom.\n- **Inline edit:** Row-level save/cancel or floating toolbar.\n\n### Button Pattern\n\n| Action | Button Style | Position |\n|--------|-------------|----------|\n| Submit/Save | Primary Filled | Rightmost |\n| Cancel/Dismiss | Outlined | Left of primary |\n| Delete/Danger | Danger Filled | Leftmost (separated) |\n| Secondary action | Ghost | Left side |\n\n### Save Behavior\n\n1. Validate all fields\n2. If errors: scroll to first error field, focus it, show error states\n3. If valid: submit \u003e show loading state on button \u003e on success: Toast + navigate/close\n4. On server error: show Alert above form with retry option\n\n## Spacing\n\n| Element | Gap |\n|---------|-----|\n| Label to field | 4px (xs) |\n| Field to helper text | 4px (xs) |\n| Between field groups | 24px (xl) |\n| Between related fields (same group) | 16px (lg) |\n| Form to action buttons | 24px (xl) with divider above |\n\n## Auto-save vs. Explicit Save\n\n| Context | Pattern |\n|---------|---------|\n| Settings toggles (switch) | Auto-save + Toast confirmation |\n| Configuration forms | Explicit Save button |\n| Inline table edit | Save per row or batch save |\n| Filters | Apply immediately (no save button) |\n\n## Do / Don't\n\n- Do: always provide a clear \"Save\" action (except auto-save contexts)\n- Don't: disable the submit button while fields are empty (let validation guide)\n- Do: preserve form state on accidental navigation (confirm discard dialog)\n- Don't: clear the form on validation error (keep user input)\n- Do: group related fields with visual proximity or a section title\n- Don't: use more than one form per page unless they're independent sections\n- Do: mark optional fields as \"(optional)\" rather than marking required ones\n\n## Implementation\n\n**Code:** `@reviewpro/ui-components` \u003e `TextField`, `TextArea`, `Select`, `Autocomplete`, `Checkbox`, `Switch`, `Button`\n**Patterns reference:** `libs/ui-components/src/styles/fieldTokens.ts` for unified state colors\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"content\":\"$11\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"ReviewPro Design System\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Design documentation, components, patterns, and foundations for the ReviewPro platform.\"}]],\"error\":null,\"di
