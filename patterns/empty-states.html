ms\n  or clearing filters.\n\n       [Clear Filters]\n```\n\n### Error State\n\nData failed to load due to a network or server error.\n\n**Structure:** Error icon + message + retry CTA\n\n```\n       [Error icon]\n    Unable to load data\n  Something went wrong. Please try\n  again or contact support.\n\n          [Retry]\n```\n\n## Sizing Contexts\n\n| Context | Size | Illustration | CTA |\n|---------|------|--------------|-----|\n| Full Page | Large | Big pictogram (200px+) | Primary Large button |\n| Content Area | Medium | Medium pictogram (120px) | Primary Small button |\n| Tile / Card | Small | Small icon (48px) or none | Ghost or Link button |\n\n## Anatomy (Perkins Component)\n\nThe Figma component \"Perkins\" (`1535:1222`) handles empty states with:\n1. **Pictogram** — swappable illustration slot\n2. **Message** — headline + description (centered)\n3. **Actions** — none, link, or button\n\n## Visual Rules\n\n- Center horizontally and vertically within the container\n- Text: headline in subtitle1 (16px/500), description in body2 (14px/400, secondary color)\n- Max text width: 320px (prevents unreadable long lines)\n- Vertical spacing: 16px between pictogram and text, 24px between text and CTA\n\n## Content Rules\n\n- Headline: state what's missing, not what went wrong\n  - \"No reviews this week\" (not \"Error: no data\")\n- Description: explain why and what to do next\n  - \"Reviews will appear here once guests complete their stay surveys.\"\n- CTA: specific action verb\n  - \"Create survey\" (not \"Get started\" or \"Learn more\")\n\n## Do / Don't\n\n- Do: provide a clear next action (CTA button or link)\n- Don't: show an empty table/list with no explanation\n- Do: differentiate \"no data ever\" from \"no results for this filter\"\n- Don't: use the same message for first-use and no-results\n- Do: keep the surrounding chrome visible (header, sidebar, breadcrumbs)\n- Don't: hide page structure when showing an empty state\n- Do: use the Perkins component for consistency\n- Don't: write custom empty state layouts per page\n\n## Implementation\n\n**Figma:** Perkins `1535:1222`, Message-Tile `1535:1232`, Message-Area `1544:13647`, Message-Page `1544:13645`\n**Code:** `@reviewpro/ui-components` \u003e `Placeholder`, `PlaceholderIcon`, `PlaceholderTitle`, `PlaceholderContent`\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"content\":\"$11\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"ReviewPro Design System\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Design documentation, components, patterns, and foundations for the ReviewPro platform.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
