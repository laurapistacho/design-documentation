 built-in `Skeleton` state variant:\n\n| Component | Skeleton behavior |\n|-----------|------------------|\n| Button | Gray rounded rectangle, no text |\n| IconButton | Gray circle |\n| Chip | Gray pill shape |\n| Table Row | Gray bars for each cell |\n| Card/Tile | Gray header bar + body lines |\n| Avatar | Gray circle |\n| Toggle | Gray track + handle |\n\n## Where to Use Skeletons\n\n| Context | Skeleton scope |\n|---------|---------------|\n| Initial page load | Full page content (below header) |\n| Tab switch | Tab content area only |\n| Table data refresh | Table body rows (keep header visible) |\n| Card content | Card body (keep card frame visible) |\n| Sidebar panel | Panel content (keep rail visible) |\n| Drawer open | Drawer content area |\n\n## Where NOT to Use Skeletons\n\n- Navigation chrome (TopNav, SideNav) — these are static, never skeleton\n- Already-loaded content on the same page — don't re-skeleton\n- Interactive controls (buttons, tabs) — they should remain responsive\n- Filters/search — user should be able to type immediately\n\n## Shimmer Animation\n\n```css\n@keyframes shimmer {\n  0% { background-position: -200px 0; }\n  100% { background-position: calc(200px + 100%) 0; }\n}\n\n.skeleton {\n  background: linear-gradient(\n    90deg,\n    #F1F1F1 25%,    /* neutral_08 */\n    #E4E4E4 50%,    /* neutral_10 */\n    #F1F1F1 75%     /* neutral_08 */\n  );\n  background-size: 200px 100%;\n  animation: shimmer 1.5s infinite;\n  border-radius: 4px;\n}\n```\n\n## Transition Behavior\n\n- **Appear:** skeleton shows immediately (no fade-in delay)\n- **Disappear:** content fades in over 200ms, replacing skeleton\n- **Partial load:** skeleton for unloaded regions, real content for loaded ones (progressive)\n\n## Inline Loading (Circular Progress)\n\nUsed only for:\n- Buttons in loading state (spinner replaces icon, text stays)\n- Autocomplete search (spinner in the right icon position)\n- Upload progress (circular with percentage)\n\nNever use a full-page centered spinner.\n\n## Do / Don't\n\n- Do: show skeletons for all data-dependent content\n- Don't: show a blank page while loading\n- Do: keep interactive elements (nav, filters) responsive during load\n- Don't: block the entire page with a loading overlay\n- Do: match skeleton shapes to content shapes precisely\n- Don't: use generic gray blocks that don't match the layout\n- Do: animate with shimmer (indicates progress, not just empty)\n- Don't: use spinners for page loads (spinners are for actions, not content)\n\n## Implementation\n\n**Code:** `@reviewpro/ui-components` \u003e `Skeleton` (via MUI), `CircularProgress`, `LinearProgress`, `Loader`\n**States:** Most components expose a `Skeleton` variant in Figma (check component variants)\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"content\":\"$11\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"ReviewPro Design System\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Design documentation, components, patterns, and foundations for the ReviewPro platform.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
