ror at a time per field (most critical first)\n- Clear error when user starts correcting (on change)\n- Don't prevent typing while in error state\n\n## Form-Level Errors\n\n**Visual:** Alert component (Error variant) above the form or below the header\n**When:** Server rejects the submission, cross-field validation fails\n\n```\n┌──────────────────────────────────────┐\n│ ⚠ Unable to save changes            │\n│ The email address is already in use. │\n│                         [Try again]  │\n└──────────────────────────────────────┘\n```\n\nRules:\n- Place above the form content, below the title\n- Include a specific message (not \"Something went wrong\")\n- Provide a retry action if applicable\n- Persists until dismissed or form is re-submitted successfully\n\n## Toast Notifications\n\n**Visual:** Snackbar/Toast at bottom-center or bottom-right\n**Duration:** Auto-dismiss after 3 seconds (error toasts: 5 seconds)\n**When:** After an action completes (success or failure)\n\n| Outcome | Toast variant | Duration |\n|---------|--------------|----------|\n| Success | Success (green) | 3s |\n| Warning | Warning (yellow) | 5s |\n| Error | Error (red) | 5s + \"Retry\" action |\n| Info | Info (blue) | 3s |\n\nRules:\n- One toast at a time (queue if multiple)\n- Include an undo/retry action when possible\n- Don't use toasts for validation errors (those belong on the field)\n\n## Page-Level Errors\n\n**Visual:** Full content area replacement (Perkins/Placeholder pattern)\n**When:** The entire page data fails to load\n\n```\n        [Error illustration]\n      Unable to load reviews\n\n  We couldn't connect to the server.\n  Check your connection and try again.\n\n            [Retry]\n```\n\nRules:\n- Keep the navigation shell visible (TopNav + SideNav)\n- Provide a Retry button\n- If the error persists after retry, suggest contacting support\n\n## Network / Connectivity\n\n**Visual:** Alert bar (warning) at the top of the content area\n**When:** Detected offline state or repeated API failures\n\n```\n┌──────────────────────────────────────┐\n│ ⚠ Connection issue — some data may  │\n│   be outdated.          [Refresh]    │\n└──────────────────────────────────────┘\n```\n\n## Error Message Writing\n\n| Principle | Example |\n|-----------|---------|\n| Be specific | \"Survey name must be unique\" not \"Invalid input\" |\n| State what to do | \"Enter a valid email address\" not \"Invalid email\" |\n| Don't blame | \"Couldn't save\" not \"You made an error\" |\n| Be concise | One sentence, no period at end |\n| Use sentence case | \"Email is required\" not \"EMAIL IS REQUIRED\" |\n\n## Do / Don't\n\n- Do: show errors as close to their source as possible (field \u003e form \u003e page)\n- Don't: use only red color to indicate errors (add icon + text for accessibility)\n- Do: provide a clear recovery action (retry, fix field, contact support)\n- Don't: show technical error codes to users (log them, show human message)\n- Do: preserve user input when an error occurs\n- Don't: clear forms after a failed submission\n- Do: stack error feedback (field error + form alert can coexist)\n- Don't: show a generic \"Something went wrong\" without context\n\n## Implementation\n\n**Field errors:** `Helper-text` component in Error state + `FieldState` Error border\n**Alerts:** `@reviewpro/ui-components` \u003e `Alert` (Error variant)\n**Toasts:** `@reviewpro/ui-components` \u003e `Toast`, `Snackbar`\n**Empty states:** `@reviewpro/ui-components` \u003e `Placeholder` family\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"content\":\"$11\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"ReviewPro Design System\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Design docume
