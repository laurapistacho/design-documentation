ax\n- Drawers overlay content (slide from right)\n\n### sm-md (768-980px) — Tablet\n\n- TopNav simplified (fewer selectors visible)\n- SideNav collapsed, opens as overlay on tap\n- Tables: fewer columns, horizontal scroll for complex tables\n- Cards stack vertically\n- Dialogs take more screen width\n\n### \u003c sm (768px) — Mobile Web\n\n- TopNav: hamburger menu replaces sidebar\n- Full-screen navigation drawer\n- Single column everything\n- Tables become card-based lists\n- Dialogs become full-screen or bottom-sheet\n- Filter bar becomes a single \"Filters\" button opening a panel\n\n## Adaptation Patterns\n\n### Content Priority (Tables)\n\nColumns have priority levels. Lower-priority columns hide first:\n\n| Priority | Example | Behavior below md |\n|----------|---------|-------------------|\n| 1 (critical) | Name, Status | Always visible |\n| 2 (important) | Date, Score | Visible \u003e= md |\n| 3 (nice-to-have) | Source, Category | Visible \u003e= lg |\n| 4 (secondary) | Created by, Notes | Available via row expand |\n\n### Cards \u0026 Tiles\n\n- Desktop: grid layout (2-3 columns)\n- Tablet: 2 columns or single column\n- Mobile: full-width stack\n\n### Navigation\n\n- Desktop: persistent SideNav rail + expandable panel\n- Tablet: collapsed rail, panel on demand\n- Mobile: hidden entirely, hamburger \u003e full-screen drawer\n\n### Actions\n\n- Desktop: visible buttons in header / row hover\n- Mobile: overflow menu (three-dot) or FAB for primary action\n\n## Touch Targets\n\nWhen adapting for tablet/mobile:\n- Minimum touch target: 44px height\n- Button minimum: 40px (Small) — meets threshold\n- Icon buttons: 44px tap area even if visual is smaller\n- List items: 48px row height minimum on mobile\n\n## Do / Don't\n\n- Do: design desktop-first, then verify tablet/mobile works\n- Don't: hide critical functionality on smaller screens\n- Do: use column priority for tables instead of horizontal scroll\n- Don't: rely on hover states for mobile (no hover on touch)\n- Do: test at 980px (our md breakpoint) — many users have this resolution\n- Don't: assume 1024px is a safe \"desktop\" width (our sidebar eats space)\n- Do: provide the same data access on all breakpoints (different presentation, same info)\n\n## Implementation\n\n**Breakpoints in code:** `@reviewpro/js-browser/themes/ui-app.ts` \u003e `breakpoints`\n**MUI responsive:** use `useMediaQuery` hook or `Hidden` / `HiddenSSR` components\n**Grid:** MUI Grid or CSS Grid — both available\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"content\":\"$11\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"ReviewPro Design System\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Design documentation, components, patterns, and foundations for the ReviewPro platform.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
