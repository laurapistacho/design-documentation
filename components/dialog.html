n\n1. **Backdrop** — semi-transparent overlay, closes on click\n2. **Container** — white surface, border-radius: m (12px), shadow-m\n3. **Title** — h6 style, top-left\n4. **Close button** — IconButton, top-right\n5. **Description** (optional) — body2 text below title\n6. **Alert slot** (optional) — for inline warnings/info\n7. **Content area** — scrollable if overflow\n8. **Footer actions** — right-aligned buttons (primary rightmost)\n\n## States\n\n| State | Border |\n|-------|--------|\n| Default | No border highlight |\n| Error | Red border on container (#D3000C) |\n\n## Footer Actions Pattern\n\n- Right-aligned, primary action rightmost\n- Cancel/dismiss = Outlined button (left)\n- Confirm/submit = Filled button (right)\n- Danger action = Danger Filled button (right)\n- Maximum 3 actions visible (more = rethink the flow)\n- Optional left-aligned action (e.g., \"Don't show again\")\n\n## Sizing\n\n| Context | Width |\n|---------|-------|\n| Small dialog | 400px |\n| Standard dialog | 560px |\n| Large dialog | 720px |\n| Mobile | Full width - 32px margin |\n\n## Do / Don't\n\n- Do: use a clear title that describes the decision (\"Delete this review?\")\n- Don't: use generic titles (\"Are you sure?\")\n- Do: make the primary action label specific (\"Delete review\", not \"OK\")\n- Don't: nest dialogs inside dialogs\n- Do: close on Escape key and backdrop click\n- Don't: prevent dismissal unless data loss would occur (unsaved form)\n- Do: keep content concise — dialogs are for focused decisions\n\n## Accessibility\n\n- Focus trap inside the dialog while open\n- Return focus to trigger element on close\n- `aria-modal=\"true\"` and proper `role=\"dialog\"`\n- Escape key dismisses\n\n## Implementation\n\n**Figma:** `1213:1167`\n**Code:** `@reviewpro/ui-components` \u003e `Dialog`, `DialogTitle`, `DialogContent`, `DialogActions`, `DialogAlert`, `DialogScreen`\n**Storybook:** `libs/ui-components/src/Dialog/`\n\n## Related\n\n- Drawer — side panel for complex content, non-blocking\n- Alert — inline, non-modal feedback\n- Popover — contextual, non-modal, attached to trigger\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"content\":\"$11\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"ReviewPro Design System\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Design documentation, components, patterns, and foundations for the ReviewPro platform.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
