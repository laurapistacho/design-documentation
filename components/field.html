\n\n## Sizes\n\n| Size | Height | Font | Usage |\n|------|--------|------|-------|\n| Large | 48px | body1 (16px) | Standalone forms, modal inputs |\n| Small | 36px | body2 (14px) | Table inline edits, compact forms, filter bars |\n\n## Styles\n\n| Style | Usage |\n|-------|-------|\n| Outlined | Default — visible border container |\n| Ghost | Inline editing — no border until focus |\n\n## States (Unified Field Tokens)\n\nAll form inputs use the same state-driven colors:\n\n| State | Border | Text | Icon |\n|-------|--------|------|------|\n| Default | #777777 | #111111 | #636363 |\n| Hover | #282828 | #111111 | #636363 |\n| Focused | #014cb7 (RPP70) | #111111 | #014cb7 |\n| Filled | #777777 | #111111 | #636363 |\n| Error | #D3000C | #111111 | #D3000C |\n| Warning | #C28A29 | #111111 | #C28A29 |\n| Disabled | #A4A4A4 | #BBBBBB | #BBBBBB |\n\n**Focus glow:** `0 0 8px 3px rgba(42, 82, 114, 0.20)` — applied on focus for all field types.\n\n## Variants\n\n### TextField\nSingle-line text input. Right icon toggles visibility (password) or clears value.\n\n### TextArea\nMulti-line text input. Resizable vertically. Shows character count if configured.\n\n### Select / Autocomplete\nDropdown with search. Can be single-select or multi-select (chips in input).\n- **Expanded:** shows dropdown list with search field\n- **Loading:** spinner replaces chevron\n- **Multi-value:** selected items appear as Chips inside the input\n\n### Searcher\nStandalone search field. Keyboard shortcut indicator (\"/\"). Clear on Escape.\n\n## Do / Don't\n\n- Do: always include a Label when the field is part of a form\n- Don't: use placeholder text as a substitute for labels\n- Do: provide Helper text for validation feedback\n- Don't: mix Large and Small fields in the same form\n- Do: use Ghost style only for inline/table editing contexts\n- Don't: disable fields without explaining why (use helper text)\n\n## Spacing\n\n| Property | Value |\n|----------|-------|\n| Label to input gap | 4px (xs) |\n| Input to helper gap | 4px (xs) |\n| Internal padding (Large) | 12px vertical, 16px horizontal |\n| Internal padding (Small) | 8px vertical, 12px horizontal |\n| Icon to text gap | 8px (s) |\n\n## Implementation\n\n**Figma:** `8564:56349` (NewField), `39:13743` (TextArea), `1213:4624` (Autocomplete), `8583:68885` (Searcher)\n**Code:** `@reviewpro/ui-components` \u003e `TextField`, `TextArea`, `Select`, `Autocomplete`, `DatePicker`, `Search`\n**Tokens:** `libs/ui-components/src/styles/fieldTokens.ts`\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$L10\",null,{\"content\":\"$11\"}]\n"])</script><script>self.__next_f.push([1,"b:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n7:null\n"])</script><script>self.__next_f.push([1,"9:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"ReviewPro Design System\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Design documentation, components, patterns, and foundations for the ReviewPro platform.\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"e:\"$9:metadata\"\n"])</script></body></html>
